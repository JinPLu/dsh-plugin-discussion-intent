# Pre-release composition used by consumer acceptance. Discussion Mode is a
# plugin-internal service: this patch only mounts the plugin itself against the
# public DSH 0.1.0-rc.6 surface (commands/sessions/system-prompt/tools plus the
# optional webServer Rail transport) and never patches DSH or redefines its
# global mode enum.
- insert:
    - id: discussion-intent
      name: '@jinplu/dsh-plugin-discussion-intent'
      config:
        enabled: true
        defaultIntensity: 2
        directory: .dsh/discussions
