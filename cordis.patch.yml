# Safe to install before the core seams land. Disabled by default so a profile
# never advertises an unavailable discussion contract.
- insert:
    - id: discussion-intent
      name: '@jinplu/dsh-plugin-discussion-intent'
      config:
        enabled: false
        requiredCapabilities:
          - cas.v1
          - records.v1
          - source-attestation.v1
          - brief-run-provenance.v1
          - ui.slots.v1
