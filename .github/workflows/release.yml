name: Stage release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Verify tag matches package version
        run: node -e "const p=require('./package.json'); const expected='v'+p.version; if(process.env.GITHUB_REF_NAME!==expected) throw new Error('tag '+process.env.GITHUB_REF_NAME+' must equal '+expected)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:consumer
        env:
          DSH_SMOKE_DSH_VERSION: 0.1.0-rc.6
      # npm holds the package until a maintainer approves it with account 2FA.
      # The GitHub Release is created only after that approval, so its tag always
      # corresponds to an installable npm version.
      - name: Stage npm package with provenance
        run: npm stage publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
